spring.application.name=report-service
server.port=8090

# ---------- Base de datos (MySQL / XAMPP) ----------
# Solo guarda el HISTORIAL de reportes generados (quién y cuándo).
# Los datos de usuarios, mascotas y citas se consultan a los otros microservicios.
spring.datasource.url=jdbc:mysql://localhost:3306/report_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---------- Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- JWT ----------
# La MISMA clave de auth-service
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos

# ---------- Otros microservicios (WebClient) ----------
auth.service.url=http://localhost:8081/api/v1
mascota.service.url=http://localhost:8082/api/v1
cita.service.url=http://localhost:8086/api/v1
contacto.service.url=http://localhost:8088/api/v1
notificacion.service.url=http://localhost:8089/api/v1
# Segundos máximos de espera por cada servicio antes de marcarlo "no disponible"
webclient.timeout-segundos=3

# ---------- CORS (frontend React con Vite) ----------
cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ==================================
# CONFIGURACION EUREKA CLIENT
# ==================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
