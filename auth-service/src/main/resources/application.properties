spring.application.name=auth-service
server.port=8081

# ---------- Base de datos (MySQL / XAMPP) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---------- Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- JWT ----------
# La MISMA clave debe ir en todos los microservicios para que validen el token
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos
# Token de acceso: 30 minutos | Token de renovacion (refresh): 7 dias
jwt.expiracion-ms=1800000
jwt.refresh-expiracion-ms=604800000

# ---------- CORS (frontend React con Vite) ----------
cors.origenes=http://localhost:5173,http://127.0.0.1:5173
