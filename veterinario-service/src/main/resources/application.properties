
# Nombre del microservicio
spring.application.name=veterinario-service

# Puerto del microservicio
server.port=8085

# Base de datos MySQL / XAMPP
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/veterinario_db
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT
# Debe utilizar la misma clave de auth-service
jwt.secret=${JWT_SECRET}

# CORS para React + Vite
cors.origenes=http://localhost:5173,http://127.0.0.1:5173
