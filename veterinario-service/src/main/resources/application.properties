
# Nombre del microservicio
spring.application.name=veterinario-service

# Puerto del microservicio
server.port=8085

# Base de datos MySQL / XAMPP
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/veterinario_db
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT
# Debe utilizar la misma clave de auth-service
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos

# CORS para React + Vite
cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ==================================
# CONFIGURACION EUREKA CLIENT
# ==================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

