
spring.application.name=novedad-service
server.port=8087

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/novedad_db
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT real compartido con auth-service
jwt.secret=${JWT_SECRET}

# CORS
cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ==================================
# CONFIGURACION EUREKA CLIENT
# ==================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
