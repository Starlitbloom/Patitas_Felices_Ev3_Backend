
# ==========================================
# PATITAS FELICES - CITA SERVICE
# ==========================================

# Nombre del microservicio
spring.application.name=cita-service

# Puerto exclusivo del microservicio de citas
server.port=8086

# ==========================================
# CONEXION A MYSQL
# ==========================================

# Base de datos donde se almacenaran las citas
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cita_db

# Credenciales de MySQL (XAMPP)
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# CONFIGURACION JPA / HIBERNATE
# ==========================================

# Actualiza las tablas segun las entidades Java
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita mantener sesiones JPA abiertas durante las respuestas
spring.jpa.open-in-view=false

# ==========================================
# DOCUMENTACION SWAGGER
# ==========================================

# Rutas para consultar y probar la API REST
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# SEGURIDAD JWT
# ==========================================

# Utiliza la misma clave de auth-service
# Se configura mediante una variable de entorno
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos


# ==========================================
# COMUNICACION CON VETERINARIO-SERVICE
# ==========================================

# Permite consultar los veterinarios reales
# registrados en MySQL mediante el puerto 8085
veterinario.service.url=http://localhost:8085/api/v1/veterinarios

# ==========================================
# COMUNICACION CON REACT
# ==========================================

# Origenes permitidos para el frontend React + Vite
cors.origenes=http://localhost:5173,http://127.0.0.1:5173
