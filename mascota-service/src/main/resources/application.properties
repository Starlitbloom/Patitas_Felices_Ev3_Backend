spring.application.name=mascota-service
server.port=8082

# ---------- Base de datos (MySQL en Docker, puerto 3306) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/mascota_db
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea y actualiza las tablas solo (igual que el resto de los microservicios)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# ---------- Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- JWT ----------
# La MISMA clave debe ir en todos los microservicios para que validen el token
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos

# ---------- CORS (frontend React con Vite) ----------
cors.origenes=http://localhost:5173,http://127.0.0.1:5173