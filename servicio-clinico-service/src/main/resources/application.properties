# Nombre del microservicio (aparece en los logs)
spring.application.name=servicio-clinico-service
# Puerto donde escucha: http://localhost:8084
server.port=8084

# ---------- Base de datos (MySQL en Docker, puerto 3306) ----------
# URL de la base servicio_clinico_db (se crea una vez con CREATE DATABASE)
spring.datasource.url=jdbc:mysql://localhost:3306/servicio_clinico_db
# Usuario de MySQL (root si no se define la variable DB_USER)
spring.datasource.username= root
# Contraseña de MySQL (vacía si no se define DB_PASSWORD)
spring.datasource.password=

# Hibernate crea y actualiza las tablas solo (igual que el resto de los microservicios)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---------- Swagger ----------
# Ruta del JSON con la documentación de la API
springdoc.api-docs.path=/v3/api-docs
# Ruta de la página de Swagger: http://localhost:8084/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- JWT ----------
# La MISMA clave debe ir en todos los microservicios para que validen el token de auth-service
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos

# ---------- CORS (frontend React con Vite) ----------
# Direcciones del frontend que pueden llamar a esta API
cors.origenes=http://localhost:5173,http://127.0.0.1:5173
