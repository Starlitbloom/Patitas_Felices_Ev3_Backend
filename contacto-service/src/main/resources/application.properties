spring.application.name=contacto-service
server.port=8088

# ---------- Base de datos (MySQL / XAMPP) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/contacto_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---------- Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- JWT ----------
# La MISMA clave de auth-service: así este servicio puede validar sus tokens
jwt.secret=PatitasFelices$2026#ClaveSecretaJWT!VeterinariaSanMarcos

# ---------- Otros microservicios (WebClient) ----------
notificacion.service.url=http://localhost:8089/api/v1

# ---------- CORS (frontend React con Vite) ----------
cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ==================================
# CONFIGURACION EUREKA CLIENT
# ==================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
